<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Редактировать игру</title>
    <link rel="icon" type="image/png" th:href="@{/images/icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="steam-header text-center rounded mb-4">
        <h1 class="display-6 fw-bold">Редактировать игру</h1>
    </div>
    <form th:action="@{'/games/edit/' + ${gameDTO.id}}" method="post" enctype="multipart/form-data" th:object="${gameDTO}">
        <div class="mb-3">
            <label for="title" class="form-label">Название</label>
            <input type="text" class="form-control" id="title" th:field="*{title}">
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Цена</label>
            <input type="number" class="form-control" id="price" th:field="*{price}" step="0.01">
        </div>

        <div class="mb-3">
            <label for="releaseDate" class="form-label">Дата релиза</label>
            <input type="date" class="form-control" id="releaseDate"
                   th:name="releaseDate"
                   th:value="${#temporals.format(gameDTO.releaseDate, 'yyyy-MM-dd')}">
        </div>

        <div class="mb-3">
            <label for="developerId" class="form-label">Разработчик</label>
            <select class="form-select" id="developerId" th:field="*{developerId}">
                <option th:each="dev : ${developers}" th:value="${dev.id}" th:text="${dev.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Жанры</label>
            <div class="border rounded p-2" style="max-height: 160px; overflow-y: auto;">
                <div class="form-check" th:each="genre : ${genres}">
                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{genreIds}"
                           th:value="${genre.id}"
                           th:id="'genre-' + ${genre.id}">
                    <label class="form-check-label"
                           th:for="'genre-' + ${genre.id}"
                           th:text="${genre.name}"></label>
                </div>
            </div>
            <small style="color: #c7d5e0;">Выберите один или несколько жанров</small>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Новая обложка (если нужно заменить)</label>
            <input type="file" class="form-control" id="image" name="image" th:field="*{image}">
        </div>

        <div th:if="${gameDTO.imageUrl != null}">
            <label>Текущая обложка:</label>
            <img th:src="@{'/uploads/' + ${gameDTO.imageUrl}}" class="preview" alt="Обложка">
        </div>

        <div class="mt-4 text-center">
            <button type="submit" class="btn steam-btn me-2">Сохранить изменения</button>
            <a th:href="@{/games}" class="btn steam-btn">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
