<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Добавить жанр</title>
    <link rel="icon" type="image/png" th:href="@{/images/icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="steam-header text-center rounded mb-4">
        <h1 class="display-6 fw-bold">Добавить жанр</h1>
    </div>
    <form th:action="@{/genres/add}" method="post" th:object="${genre}">
        <div class="mb-3">
            <label for="name" class="form-label">Название жанра</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Введите жанр">
        </div>

        <div class="mt-4 text-center">
            <button type="submit" class="btn steam-btn me-2">Добавить</button>
            <a th:href="@{/games}" class="btn steam-btn">На главную</a>
        </div>
    </form>
</div>
</body>
</html>
