<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Жанры</title>
    <link rel="icon" type="image/png" th:href="@{/images/icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="steam-header text-center rounded mb-4">
        <h1 class="display-5 fw-bold">Жанры</h1>
    </div>

    <div class="mb-3 text-end">
        <a class="btn steam-btn" th:href="@{/genres/add}"><b>+ Добавить жанр</b></a>
        <a class="btn steam-btn ms-2" th:href="@{/games}"><b>Назад к играм</b></a>
    </div>

    <div class="table-responsive rounded">
        <table class="table table-dark table-striped table-hover steam-table align-middle text-center">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="genre : ${genres}">
                <td th:text="${genre.id}">ID</td>
                <td th:text="${genre.name}">Название</td>
                <td>
                    <a th:href="@{/genres/delete/{id}(id=${genre.id})}" class="btn btn-danger btn-sm">Удалить</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
