<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/png" th:href="@{/images/icon.png}">
    <title>Каталог видеоигр</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="steam-header text-center rounded mb-4">
        <h1 class="display-5 fw-bold">Каталог видеоигр</h1>
    </div>

    <div class="mb-3 d-flex justify-content-between align-items-center">
        <form method="get" th:action="@{/games}">
            <label for="sort" class="text-light mb-1 d-block">Сортировка:</label>
            <select id="sort" class="form-select steam-btn" name="sort" onchange="this.form.submit()">
                <option value="" th:selected="${selectedSort == null}">Сортировать по...</option>
                <option value="title" th:selected="${selectedSort == 'title'}">Названию</option>
                <option value="price" th:selected="${selectedSort == 'price'}">Цене</option>
                <option value="releaseDate" th:selected="${selectedSort == 'releaseDate'}">Дате релиза</option>
            </select>
        </form>

        <div class="text-end">
            <a class="btn steam-btn me-2" th:href="@{/games/add}"><b>+ Добавить новую игру</b></a>
            <a class="btn steam-btn me-2" th:href="@{/developers}"><b>Разработчики</b></a>
            <a class="btn steam-btn" th:href="@{/genres}"><b>Жанры</b></a>
        </div>
    </div>

    <div class="table-responsive rounded">
        <table class="table table-dark table-striped table-hover steam-table align-middle text-center">
            <thead>
            <tr>
                <th>Обложка</th>
                <th>Название</th>
                <th>Цена</th>
                <th>Дата релиза</th>
                <th>Разработчик</th>
                <th>Жанры</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="game : ${games}">
                <td>
                    <img th:if="${game.imageUrl != null}" th:src="@{${game.imageUrl}}" class="game-cover" alt="Обложка">
                </td>
                <td th:text="${game.title}">Название</td>
                <td th:text="${game.price != null ? #numbers.formatDecimal(game.price, 1, 2) + ' $' : '—'}">Цена</td>
                <td th:text="${game.releaseDate}">Дата релиза</td>
                <td th:text="${game.developerName}">Разработчик</td>
                <td>
                    <span th:text="${#strings.listJoin(game.genreNames, ', ')}"></span>
                </td>
                <td>
                    <a th:href="@{/games/edit/{id}(id=${game.id})}" class="btn btn-primary btn-sm me-1">Изменить</a>
                    <a th:href="@{/games/delete/{id}(id=${game.id})}" class="btn btn-danger btn-sm">Удалить</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
