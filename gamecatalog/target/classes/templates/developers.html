<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Разработчики</title>
    <link rel="icon" type="image/png" th:href="@{/images/icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="steam-header text-center rounded mb-4">
        <h1 class="display-5 fw-bold">Разработчики</h1>
    </div>

    <div class="mb-3 text-end">
        <a class="btn steam-btn me-2" th:href="@{/developers/add}">
            <b>+ Добавить разработчика</b>
        </a>
        <a class="btn steam-btn" th:href="@{/games}">
            <b>На главную</b>
        </a>
    </div>

    <div class="table-responsive rounded">
        <table class="table table-dark table-striped table-hover steam-table align-middle text-center">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название студии</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dev : ${developers}">
                <td th:text="${dev.id}">ID</td>
                <td th:text="${dev.name}">Название</td>
                <td>
                    <a th:href="@{/developers/delete/{id}(id=${dev.id})}" class="btn btn-danger btn-sm">Удалить</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
